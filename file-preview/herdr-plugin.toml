id = "kmorey.file-preview"
name = "File Preview"
version = "0.5.0"
min_herdr_version = "0.8.2"
description = "Preview agent-generated files in a Herdr pane"
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["npm", "ci", "--omit=dev", "--ignore-scripts"]

[[actions]]
id = "open-current"
title = "Open current visual proof"
contexts = ["pane"]
command = ["node", "open-current.mjs"]

[[panes]]
id = "viewer"
title = "File preview"
placement = "split"
command = ["node", "viewer.mjs"]
