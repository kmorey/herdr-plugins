id = "kmorey.visual-proof"
name = "Visual Proof"
version = "0.4.0"
min_herdr_version = "0.8.2"
description = "Preview agent-generated PNG visual proof in a Herdr pane"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "open-current"
title = "Open current visual proof"
contexts = ["pane"]
command = ["node", "open-current.mjs"]

[[panes]]
id = "viewer"
title = "Visual proof"
placement = "split"
command = ["node", "viewer.mjs"]
